name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Always-on tier: build, vet, test and self-validate the CLI on all platforms.
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: gofmt (lint)
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed on:'; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: self-validate (skills + adapters)
        run: go run ./cmd/godot-ai-toolkit validate
      - name: catalog up to date
        run: go run ./cmd/godot-ai-toolkit catalog --check

  # SDK-gated tier: attempt to build the C# fixture. Non-blocking: restoring the
  # Godot.NET.Sdk requires network/package availability. A failure here is a
  # SKIP, not a pass — see the step summary.
  dotnet-fixture:
    name: csharp fixture build (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet build (csharp fixture)
        run: dotnet build tests/fixtures/csharp-project

  # Engine tier: provision Godot 4.7.2 (+ .NET) on Linux and run the engine-level
  # verification. GDScript is parse-verified and C# is build-verified. Other
  # platforms are a possible later expansion.
  engine-linux:
    name: engine tier (Godot 4.7.2, Linux)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL "$url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT_BIN=/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: godot --version
        run: "$GODOT_BIN --version --headless"
      - name: verify engine tier (fixture)
        run: go run ./cmd/godot-ai-toolkit verify --skills-dir tests/fixtures/verify
      - name: verify skills catalog
        run: go run ./cmd/godot-ai-toolkit verify --skills-dir skills
